name: Deploy Docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install "zensical==0.1.3"  # 锁定版本，避免 0.x 期间上游破坏性变更导致部署失败
      # 泛型 API 页文件名采用 URL 安全的 -of- 形式(如 ObservableList-of-T.md)，
      # edit_uri 拼接出的 URL 恒为合法 IRI，不再依赖 zensical 的具体版本。
      # 缘由见 zensical.toml 中 edit_uri 注释。
      - run: zensical build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with: { path: site }
      # actions/deploy-pages#451：同一 job 内 upload 刚 finalize 时，后端 ListArtifacts
      # 有短暂不可见窗口（本仓实测 finalize 后 0.24 秒查询返回 0 个工件），且重跑可能
      # 触发重复工件报错。REST artifacts API 走另一个服务、探测不到该窗口，故以延时等待
      # 为主，并校验 upload 确实输出了 artifact_id。
      - name: Wait for artifact visibility
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID" || { echo "::error::upload-pages-artifact 未输出 artifact_id"; exit 1; }
          echo "工件 $ARTIFACT_ID 已上传，等待后端列表可见..."
          sleep 20
      - uses: actions/deploy-pages@v5