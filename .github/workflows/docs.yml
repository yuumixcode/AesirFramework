name: Deploy Docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install "zensical==0.1.3"  # 锁定版本，避免 0.x 期间上游破坏性变更导致部署失败
      # 泛型 API 页文件名采用 URL 安全的 -of- 形式(如 ObservableList-of-T.md)，
      # edit_uri 拼接出的 URL 恒为合法 IRI，不再依赖 zensical 的具体版本。
      # 缘由见 zensical.toml 中 edit_uri 注释。
      - run: zensical build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - uses: actions/deploy-pages@v5