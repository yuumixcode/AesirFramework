name: Auto Release Packages

# 本仓库是 CNB 主仓（cnb.cool/runestone-game/AesirFramework）的镜像，GitHub 侧零提交、零 tag 创建。
# tag 由 CNB 流水线滚动生成并经 git-sync 推送过来。
#
# 发布主路径：CNB 的 v* tag_push 流水线用 REST API 直接发 GitHub Release（见 .cnb.yml
#   publish-github-release stage）——实测 git-sync 推上来的 tag 不可靠地触发本 workflow
#   （tag 已送达但无 PushEvent / 无 run），故 GitHub Release 不再依赖本触发。
# 本工作流保留为幂等兜底：若哪天 tag-push 触发恢复，它 delete+create 的结果与 CNB 一致；
#   也可用 workflow_dispatch 手动补发任意 tag。
# 资产为 RAA / RAM / RAF 三个 .unitypackage（RAF = 两包合并），说明取自根 CHANGELOG 对应版本段落。
# tag 本身归 CNB 管，这里只删旧 Release、不删 tag。
# update-info.json 由 CNB 流水线生成并提交回主仓（经同步到达本仓库），供包内更新器经 jsDelivr 检测版本。
# 纯 Python 生成 unitypackage（格式经 Unity 导出参考包逐字节校验），CI 无需 Unity 编辑器。
on:
  push:
    tags: ['v*']
  # tag-push webhook 实测不可靠，手动兜底入口（指定要发布的 tag）
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.34.0）'
        required: true
        type: string

# GITHUB_TOKEN 需要写权限以创建 Release
permissions:
  contents: write

# 同一工作流的多次运行只保留最新一次
concurrency:
  group: auto-release
  cancel-in-progress: true

jobs:
  release:
    # 跳过 tag 删除事件（滚动重建 / 清理时可能先删后推）；dispatch 手动触发始终放行
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.deleted == false)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # dispatch 时检出指定 tag，保证 package.json / CHANGELOG 与该版本一致
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify tag matches package versions
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          ARCH=$(jq -r '.version' Assets/Runestone/AesirArchitecture/package.json)
          MODS=$(jq -r '.version' Assets/Runestone/AesirModules/package.json)
          if [ "$ARCH" != "$MODS" ] || [ "$ARCH" != "$VERSION" ]; then
            echo "::error::Version mismatch: tag=$VERSION Architecture=$ARCH Modules=$MODS"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "📦 Release version: $VERSION"

      - name: Build unitypackages (RAA / RAM / RAF)
        run: |
          python .github/scripts/build_unitypackage.py \
            --package Assets/Runestone/AesirArchitecture \
            --output "dist/AesirArchitecture-v${VERSION}.unitypackage"
          python .github/scripts/build_unitypackage.py \
            --package Assets/Runestone/AesirModules \
            --output "dist/AesirModules-v${VERSION}.unitypackage"
          python .github/scripts/build_unitypackage.py \
            --package Assets/Runestone/AesirArchitecture \
            --package Assets/Runestone/AesirModules \
            --output "dist/AesirFramework-v${VERSION}.unitypackage"
          ls -lh dist/

      - name: Extract release notes from CHANGELOG
        run: |
          python .github/scripts/extract_release_notes.py \
            --changelog CHANGELOG.md \
            --version "${VERSION}" > release_notes.md
          cat release_notes.md

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 滚动发布：删除旧 Release（保留 tag——tag 归 CNB 管），在现有 tag 上重建
          gh release delete "$TAG" --yes 2>/dev/null || true

          gh release create "$TAG" \
            --title "${TAG}" \
            --notes-file release_notes.md \
            dist/*
