name: Auto Publish Package Branches

# 触发条件：推送到 main 分支，或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 需要写权限以推送分支
permissions:
  contents: write

# 同一工作流的多次运行只保留最新一次
concurrency:
  group: auto-publish-branches
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # 任一包失败不影响其他包
      fail-fast: false
      matrix:
        include:
          # 包目录名 → 常驻发布分支（分支名永久固定：Git URL 一次输入即可持续获取最新版，
          # 升级 = Package Manager 移除后用同一 URL 重新添加；需要钉死旧版本时改用
          # Release tag + ?path=<包路径>，见 prune-obsolete-branches 作业说明）
          - package: AesirArchitecture
            branch: AesirArchitecture-latest
          - package: AesirModules
            branch: AesirModules-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史，subtree split 需要

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Split and push package branch
        run: |
          PACKAGE_DIR="Assets/Runestone/${{ matrix.package }}"
          BRANCH="${{ matrix.branch }}"

          if [ ! -d "$PACKAGE_DIR" ]; then
            echo "::error::Package directory $PACKAGE_DIR does not exist"
            exit 1
          fi

          echo "📦 Splitting $PACKAGE_DIR → branch $BRANCH"

          # 删除本地同名分支（fresh checkout 通常不存在，保险起见）
          git branch -D "$BRANCH" 2>/dev/null || true

          # 将子目录拆分为独立分支（包内容成为分支根目录）
          git subtree split --prefix="$PACKAGE_DIR" --branch "$BRANCH"

          # ── 分发裁剪：UPM 产物只保留 Package Manager 认的那一份 ──────────
          # monorepo 内为方便开发与 Assets 目录安装，同时保留两套镜像：
          #   Samples/        开发可见 + 随 unitypackage 导出
          #   Samples~/       Package Manager「Import」的唯一来源
          #   Documentation/  开发可见 + 随 unitypackage 导出
          #   Documentation~/ Package Manager 隐藏副本
          # 两者带完全相同的 .meta GUID。若原样推到 UPM 分支：
          #   ① 非 ~ 的 Samples/ 会被 Unity 正常索引 → 每个消费工程无条件
          #      多出 11~16 个样例程序集与约 75 个脚本、12 个场景/预制体；
          #   ② 用户经 Package Manager 导入样例时 GUID 被保留，与已被索引的
          #      Samples/ 副本撞车，同一项目内两个资产共用一个 GUID。
          # 故 UPM 分支剔除开发侧副本，只留 Package Manager 认的 ~ 版。
          # （unitypackage 侧由 build_unitypackage.py 的 _is_ignored_name
          #   过滤 ~ 目录，方向与此处相反，两条分发线互为补集）
          git checkout "$BRANCH"
          REMOVED=0
          for DEV_DIR in Samples Documentation; do
            if [ -e "$DEV_DIR" ]; then
              echo "🧹 Removing dev-only folder from UPM branch: $DEV_DIR"
              git rm -r -q --ignore-unmatch "$DEV_DIR"
              # 目录自带的 .meta 同样剔除（Documentation/ 在 monorepo 内带 .meta）
              if [ -f "$DEV_DIR.meta" ]; then
                git rm -q --ignore-unmatch "$DEV_DIR.meta"
              fi
              REMOVED=1
            fi
          done
          if [ "$REMOVED" -eq 1 ]; then
            git commit -q -m "chore: 剔除开发侧 Samples/ 与 Documentation/ 镜像（UPM 分发只保留 ~ 版）"
          fi

          # ── 校验：UPM 分支不得残留开发侧副本 ────────────────────────────
          LEFTOVER=""
          for DEV_DIR in Samples Documentation; do
            [ -e "$DEV_DIR" ] && LEFTOVER="$LEFTOVER $DEV_DIR"
            [ -e "$DEV_DIR.meta" ] && LEFTOVER="$LEFTOVER $DEV_DIR.meta"
          done
          if [ -n "$LEFTOVER" ]; then
            echo "::error::$BRANCH still contains dev-only entries:$LEFTOVER — UPM 分发裁剪失败"
            exit 1
          fi
          # 反向校验：必须保留 Package Manager 的样例来源
          for KEEP_DIR in Samples~ Documentation~; do
            if [ ! -d "$KEEP_DIR" ]; then
              echo "::error::$BRANCH is missing $KEEP_DIR — Package Manager 样例/文档入口会被切断"
              exit 1
            fi
          done
          echo "✅ 分发裁剪校验通过（保留 Samples~ / Documentation~，已剔除 Samples/ / Documentation/）"

          # 强制推送到远端（分支名固定，滚动指向最新提交）
          git push origin "$BRANCH" --force

          echo "✅ Published $BRANCH — latest commit:"
          git log --oneline -1 "$BRANCH"

  # 旧策略的版本分支（AesirXxx-v<版本>）已废弃：分支名随发版轮换且旧分支随发版删除，
  # 消费者钉住的 Git URL 会直接失效（Package Manager 报 "Could not clone"）。
  # 钉版入口统一为 Release tag（?path=<包路径>#v<版本>，tag 永久保留）；
  # 本作业清理远端残留的版本分支，防止消费者误钉注定会被删除的分支。
  prune-obsolete-branches:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete obsolete version branches
        run: |
          OBSOLETE=$(git ls-remote --heads origin \
            'refs/heads/AesirArchitecture-v*' 'refs/heads/AesirModules-v*' \
            | awk '{print $2}')
          if [ -z "$OBSOLETE" ]; then
            echo "无废弃版本分支需要清理。"
            exit 0
          fi
          for ref in $OBSOLETE; do
            branch="${ref#refs/heads/}"
            echo "🗑 Deleting obsolete version branch: $branch"
            git push origin --delete "$branch"
          done
