# CNB 国内下载仓流水线（GitHub 是开发主仓：github.com/yuumixcode/AesirFramework）
#
# 本仓不做任何开发提交：main / 两包分支 / tags 全部由 GitHub 的 sync-to-cnb.yml
# 在每次 main push 后 force 写入，CNB 侧的直接提交会被覆盖。
#
# 职责只留两条：
# - v* tag_push：打 unitypackage → 发 CNB Release（国内下载加速）。
#   GitHub Release 由 GitHub auto-release.yml 在同一 tag 上独立发布，两边资产同源。
# - web_trigger_push_github：CNB AI Issue 修复分支手动反推 GitHub（分支详情页按钮，
#   配置见 .cnb/web_trigger.yml）。推到 GitHub 后开 PR 正常 Merge，
#   合并触发 GitHub 同步流水线，结果自动 force 写回本仓，闭环完成。
#
# 注意：反推用的 GIT_ACCESS_TOKEN 是 OAuth 类令牌，未授予 workflow scope 时
# GitHub 会拒绝改动 .github/workflows/* 的分支推送——这类修复请改走本地 SSH 直推。

"v*":
  tag_push:
    - name: cnb-release
      lock:
        wait: true
        timeout: 1800
      retry: 2
      stages:
        - name: build-unitypackages
          image: python:3.12
          script: |
            set -e
            VERSION="${CNB_BRANCH#v}"
            python3 .github/scripts/build_unitypackage.py \
              --package Assets/Runestone/AesirArchitecture \
              --output "dist/AesirArchitecture-v${VERSION}.unitypackage"
            python3 .github/scripts/build_unitypackage.py \
              --package Assets/Runestone/AesirModules \
              --output "dist/AesirModules-v${VERSION}.unitypackage"
            python3 .github/scripts/build_unitypackage.py \
              --package Assets/Runestone/AesirArchitecture \
              --package Assets/Runestone/AesirModules \
              --output "dist/AesirFramework-v${VERSION}.unitypackage"
            python3 .github/scripts/extract_release_notes.py \
              --changelog CHANGELOG.md --version "$VERSION" > release_notes.md
            ls -lh dist/

        # overlying 默认 false = 先删后建，正好匹配滚动发布语义
        - name: create-release
          type: git:release
          options:
            title: $CNB_BRANCH
            descriptionFromFile: release_notes.md
            latest: true

        - name: upload-assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./dist/*.unitypackage"

# CNB AI Issue 修复分支反推 GitHub：在分支详情页点「反推此分支到 GitHub」按钮触发。
# 只允许临时修复分支；main 与常驻包分支的真源在 GitHub，禁止从 CNB 反向覆盖。
"**":
  web_trigger_push_github:
    - name: push-branch-to-github
      imports:
        - https://cnb.cool/runestone-game/secrets/-/blob/main/github.yml
      stages:
        - name: push
          script: |
            set -e
            case "$CNB_BRANCH" in
              main|AesirArchitecture-latest|AesirModules-latest)
                echo "禁止反推 $CNB_BRANCH：该分支真源在 GitHub，请在 GitHub 侧合并后由同步流水线写回"
                exit 1
                ;;
            esac
            # 浅克隆无法向外部仓库推送，先补全历史
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow origin
            fi
            git push -f "https://${GIT_USERNAME}:${GIT_ACCESS_TOKEN}@github.com/yuumixcode/AesirFramework.git" \
              "HEAD:refs/heads/$CNB_BRANCH"
            echo "✅ 已推送分支 $CNB_BRANCH 到 GitHub，请在 GitHub 开 PR 合并"
