# 搜索面板在 shadow DOM 内,外部样式无法触达,需用脚本补中文 placeholder 与熔金焦点环
extra_javascript = ["javascripts/aesir-search.js", "javascripts/aesir-a11y.js"]

[project.theme]
variant = "modern"
language = "zh"
logo = "assets/logo.png"
favicon = "assets/favicon.png"
# 自托管字体(Space Grotesk / Inter / JetBrains Mono,拉丁子集):
# 关闭主题默认的 Google Fonts 链接,规避国内不可达与外部依赖。
font = false
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.top",
  "navigation.indexes",
  "navigation.footer",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.action.edit",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "切换至夜间模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "切换至日间模式"

[project.plugins.search]
# 0.0.58+ 重写 search 插件后仅支持 enabled / separator;
# CJK 分词由站点语言 language = "zh" 自动启用
separator = "[\\s\\u200b\\-]+"

# Markdown 扩展(声明该表后会完全替换默认扩展集,需列全)
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
toc_depth = 3
permalink = true

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions."pymdownx.superfences"]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true
