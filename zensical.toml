[project]
site_name = "AesirFramework"
site_url = "https://yuumixcode.github.io/AesirFramework/"
site_description = "AesirFramework 官方站点 —— 渐进式 MVC 架构框架 Aesir Architecture 与功能模块 Aesir Modules(Unity / 团结引擎)"
site_author = "yuumixcode"
copyright = "© 2026 Runestone Yuumix · MIT License"
repo_url = "https://github.com/yuumixcode/AesirFramework"
repo_name = "yuumixcode/AesirFramework"
# 泛型 API 页文件名采用 URL 安全的 "-of-" 形式(如 ObservableList-of-T.md,规则见
# TypeAnalyzerUtility.ConvertToDocumentationFileName)。原因:zensical 会把「仓库地址 +
# edit_uri + 页面源路径」拼成绝对 URL 并按 IRI 校验,尖括号/花括号/空格都是非法 IRI 字符,
# 遇到未转义花括号即 panic(实测 0.1.3 仍如此;上游 0.1.2 #1147 仅补充方括号转义,
# 花括号至今未修)。路径合法后 edit_uri 可安全启用,「编辑此页」链接不依赖 zensical 具体版本。
edit_uri = "edit/main/docs"   # 默认分支是 main,勿用默认回填的 edit/master
