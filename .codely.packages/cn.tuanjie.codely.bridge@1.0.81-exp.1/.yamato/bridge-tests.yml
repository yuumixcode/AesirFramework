    - command: C:\tools\upm-ci.exe package test --type package-tests --unity-version %UNITY_VERSION% --platform editmode --extra-editor-arg=-disableEditorAnalytics
      retries: 2
  after:
    - IF EXIST "%HOMEDRIVE%%HOMEPATH%\AppData\Local\Unity\Unity.Licensing.Client.log" mv %HOMEDRIVE%%HOMEPATH%\AppData\Local\Unity\Unity.Licensing.Client.log upm-ci~/ReportedArtifacts/. || true
    - IF EXIST "%HOMEDRIVE%%HOMEPATH%\AppData\Local\Tuanjie\Tuanjie.Licensing.Client.log" mv %HOMEDRIVE%%HOMEPATH%\AppData\Local\Tuanjie\Tuanjie.Licensing.Client.log upm-ci~/ReportedArtifacts/. || true
    - IF NOT EXIST "C:\cygwin64\bin\mkdir.exe" mkdir -p upm-ci~/CrashDumps
    - IF EXIST "C:\cygwin64\bin\mkdir.exe" C:\cygwin64\bin\mkdir.exe -p upm-ci~/CrashDumps
    - cp -R C:\CrashDump/* upm-ci~/CrashDumps/. || true
  artifacts:
    crash-dumps:
      paths:
        - upm-ci~/CrashDumps/**
    reported-artifacts:
      paths:
        - upm-ci~/ReportedArtifacts/**
  dependencies:
    - .yamato/upm-ci.yml#pack
  variables:
    UNITY_VERSION: C:\editor\6000.5.3f1\
    PACKAGE_NAME: cn.tuanjie.codely.bridge
